[package]
name = "tally-mcp"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"

[features]
default = ["ui", "byok", "packs"]
ui    = ["dep:tiny_http"]
byok  = ["dep:ureq", "dep:keyring"]
packs = []

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "sync", "time", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = { version = "0.36", features = ["serialize", "encoding"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
rust_decimal = { version = "1", features = ["serde-float"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"
thiserror = "1"
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = { version = "0.12", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json"], optional = true }
keyring = { version = "3", features = ["windows-native"], optional = true }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
